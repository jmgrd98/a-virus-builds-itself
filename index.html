<script>

  for (let i = 0; i < 5; i++)V.push([R * Math.cos(i * TAU / 5 + phi), hc + H, R * Math.sin(i * TAU / 5 + phi)]);

    const m = (n + 1) % 5;

    faces.push([[1 + n, 1 + m, 6 + n], [[0, 0], [3, 1], [-2, 6]]]);
    faces.push([[6 + n, 1 + m, 6 + m], [[-2, 6], [3, 1], [1, 7]]]);

  }
  const cart = (i, j) => [i + j / 2, j * 0.8660254038];

  for (const [vi, lt] of faces) {

    const det = (b2[0] - a2[0]) * (c2[1] - a2[1]) - (c2[0] - a2[0]) * (b2[1] - a2[1]);
    const bary = p => { const w1 = ((p[0] - a2[0]) * (c2[1] - a2[1]) - (c2[0] - a2[0]) * (p[1] - a2[1])) / det, w2 = ((b2[0] - a2[0]) * (p[1] - a2[1]) - (p[0] - a2[0]) * (b2[1] - a2[1])) / det; return [1 - w1 - w2, w1, w2]; };
